      - name: "The infuse"
        volume_mL_per_person: 60
        density_kg_L: 1.0
        agribalyse_codes: [18020]
        confidence: HIGH
        source: "GEMRCN 2011: 30 % des convives prennent du the (200 mL × 0.30 = 60 mL/couvert moyen)"

      - name: "Mini-viennoiseries (croissant, pain au chocolat)"
        pieces_per_person: 2
        mass_per_piece_g: 30
        agribalyse_codes:
          - {code: 7620, confidence: HIGH}
          - {code: 7730, confidence: MEDIUM}
          - {code: 7615, confidence: MEDIUM}
        source: "GEMRCN 2011: 40-60 g viennoiseries/PDJ collectif. Norme traiteur: 2 mini-pieces ~30 g. Codes: croissant beurre / pain au chocolat / croissant ordinaire"

      - name: "Fruits frais (salade de fruits ou fruit entier)"
        pieces_per_person: 1
        mass_per_piece_g: 100
        agribalyse_codes: [13708, 13034, 13039]
        confidence: MEDIUM
        source: "GEMRCN 2011: 100-150 g de fruits par repas. Codes: macedoine fruits / orange / pomme crue"

      - name: "Jus de fruits (orange ou multifruits)"
        volume_mL_per_person: 150
        density_kg_L: 1.0
        agribalyse_codes:
          - {code: 2012, confidence: HIGH, mass_cv: 0.187}
          - {code: 2048, confidence: MEDIUM, mass_cv: 0.2}
        source: "GEMRCN 2011: 100-200 mL jus de fruits au PDJ. Codes: jus d'orange concentre / jus multifruit base pomme"

      - name: "Sucre en morceaux"
        pieces_per_person: 1
        mass_per_piece_g: 5
        agribalyse_codes: [31016]
        confidence: HIGH
        source: "Standard dosette individuelle: 1 sachet sucre = 5 g"

      - name: "Lait demi-ecreme"
        mass_g_per_person: 30
        agribalyse_codes: [19041]
        confidence: HIGH
        source: "Standard dosette lait traiteur: mini-brique ~30 mL (densité ~1.03 kg/L → ~30 g). Code: lait demi-ecreme UHT"

