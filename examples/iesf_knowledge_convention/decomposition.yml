# decomposition.yml – IESF Knowledge Convention
# ================================================
# Maps each invoice line (invoice.xlsx) to elementary products with sourced
# mass estimates. Read by inventory_builder.py.
#
# Methodology references:
#   GEMRCN  – Recommandations relatives à la nutrition, 2011 (rev. 2015)
#   ANSES   – INCA3 étude individuelle nationale, 2017
#   Traiteur usage – norme professionnelle traiteur collectif (France)
#
# Agribalyse v3.2 codes are verified.  Multiple codes per component represent
# candidate products (best / worst scenario); agribalyse_autoderive.py selects the
# lowest / highest EF score among them.
#
# Confidence levels:
#   HIGH   – quantity from invoice or certified GEMRCN norm
#   MEDIUM – hypothese de l'etude, usage courant en restauration
#   LOW    – estimated by proxy or analogy (forfait without detail, unknown composition)

items:

  # ══════════════════════════════════════════════════════════════════════════
  # WE1 – Social Event – Swing Bar Fontainebleau (04/10/2025)
  # Forfait global 1 200 EUR / 60 pers = 20 EUR/pers (boissons + snacking)
  # ══════════════════════════════════════════════════════════════════════════

  - group: WE1
    meal_type: "Social Event"
    invoice_item: "Boissons (vins bieres softs)"
    # nb_guests: 60  (from invoice)
    components:
      - name: "Vin rouge"
        volume_mL_per_person: 225
        density_kg_L: 1.0
        agribalyse_codes: [5214]
        confidence: MEDIUM
        source: "Hypothese de l'etude : 1,5 verre de vin rouge (150 mL) par personne en cocktail"

      - name: "Vin blanc sec"
        volume_mL_per_person: 75
        density_kg_L: 1.0
        agribalyse_codes: [5215]
        confidence: MEDIUM
        source: "Hypothese de l'etude : 0,5 verre de vin blanc, un tiers des convives"

      - name: "Biere"
        volume_mL_per_person: 330
        density_kg_L: 1.0
        agribalyse_codes:
          - {code: 5001, confidence: MEDIUM}
          - {code: 5011, confidence: LOW}
        source: "Standards service bar evenementiel: 1 verre biere (33 cL). Codes 5001 (coeur de marche) / 5011 (specialite)"

      - name: "Boisson gazeuse sucree (soft)"
        volume_mL_per_person: 250
        density_kg_L: 1.0
        agribalyse_codes: [18049, 18010]
        confidence: LOW
        source: "Hypothese: 1 verre soft (25 cL). Proxy: boisson gazeuse aux fruits sucree / limonade"

  - group: WE1
    meal_type: "Social Event"
    invoice_item: "Snacking (planches aperitives variees)"
    components:
      - name: "Fromage pour plateau aperitif"
        pieces_per_person: 1
        mass_per_piece_g: 40
        agribalyse_codes: [12001, 12115]
        confidence: MEDIUM
        source: "Hypothese de l'etude : 40 g de fromage par personne en aperitif. Codes: camembert / emmental"

      - name: "Houmous/tartinade vegetale"
        pieces_per_person: 1
        mass_per_piece_g: 40
        agribalyse_codes: [25621]
        confidence: LOW
        source: "VEGETARIEN. Hypothese de l'etude : 40 g de tartinade par personne. Code: houmous"

      - name: "Olives aperitif"
        pieces_per_person: 1
        mass_per_piece_g: 30
        agribalyse_codes: [13147]
        confidence: LOW
        source: "Hypothese 30 g olives/pers. Ref: portions standard cocktail"

      - name: "Chips"
        pieces_per_person: 1
        mass_per_piece_g: 30
        agribalyse_codes: [4004]
        confidence: MEDIUM
        source: "Hypothese 30 g chips/pers (1 poignee). Ref: portions standard cocktail"

      - name: "Pain / crackers aperitif"
        pieces_per_person: 1
        mass_per_piece_g: 40
        agribalyse_codes: [7100, 38407]
        confidence: LOW
        mass_cv: 0.81   # portion below the GEMRCN adult range: upper bound at the 95th percentile
        source: "Hypothese de l'etude : 40 g de pain ou crackers par personne. Codes: pain courant / biscuit aperitif feuillete"

